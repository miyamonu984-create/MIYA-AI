<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miya AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <header>
            <h1>🤖 Miya</h1>
            <p>Your Personal AI</p>
        </header>

        <main id="chat">
            <div class="message miya">
                Hi! I'm Miya 👋
            </div>
        </main>

        <div class="input-area">
            <button id="voiceBtn">🎙️</button>

            <input
                type="text"
                id="messageInput"
                placeholder="Message Miya..."
            >

            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
